<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | ACON Construction</title><style>:root{font-family:Arial,sans-serif;color:#142b4c}*{box-sizing:border-box}body{margin:0;background:#f3f6fa}header{background:#142b4c;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}header a{color:#b9ee72}main{max-width:1100px;margin:30px auto;padding:0 18px}.panel{background:white;border:1px solid #dce4ed;border-radius:12px;padding:22px;margin:18px 0}input,textarea,select{width:100%;padding:11px;margin:6px 0 14px;border:1px solid #aebed1;border-radius:6px;font:inherit}textarea{min-height:90px}label{display:block;font-weight:bold}button{background:#8bd432;color:#142b4c;border:0;border-radius:6px;padding:11px 17px;font-weight:bold;cursor:pointer;margin:4px 5px 4px 0}button.secondary{background:#dfe7f0}button.danger{background:#fbd8d8}.hide{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.item{border:1px solid #dce4ed;padding:15px;border-radius:8px;margin:10px 0}img{max-width:180px;max-height:120px;object-fit:cover}.muted{color:#52657c;font-size:14px}#msg{white-space:pre-wrap;padding:10px;border-radius:6px}#msg:not(:empty){background:#e9f3ff}nav button{background:#dfe7f0}nav button.selected{background:#8bd432}@media(max-width:600px){header{flex-direction:column;align-items:start}}</style></head><body><header><strong>ACON <span style="color:#8bd432">CONSTRUCTION</span> · Administración</strong><a href="index.html">Ver web pública</a></header><main><div id="msg" role="status"></div><section id="setup" class="panel hide"><h2>Conexión pendiente</h2><p>Configura <code>supabase-config.js</code> con la Project URL y la clave pública de Supabase. No uses una clave secreta.</p></section><section id="login" class="panel hide"><h2>Acceso privado</h2><form id="loginForm"><label>Correo electrónico<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button>Iniciar sesión</button></form></section><section id="dashboard" class="hide"><div class="panel"><strong id="who"></strong> <button class="secondary" id="logout">Cerrar sesión</button><nav><button data-tab="projects" class="selected">Proyectos</button><button data-tab="services">Servicios</button><button data-tab="settings">Contactos</button></nav></div><section id="projects" class="panel tab"><h2>Proyectos</h2><form id="projectForm"><input type="hidden" id="projectId"><label>Nombre<input id="projectTitle" required></label><label>Categoría<input id="projectCategory" value="Construcción"></label><label>Ubicación<input id="projectLocation"></label><label>Estado<input id="projectStatus" value="Ejecutado"></label><label>Descripción<textarea id="projectDescription"></textarea></label><label>Fotografía de portada (JPG, PNG o WebP, hasta 8 MB)<input id="projectImage" type="file" accept="image/jpeg,image/png,image/webp"></label><label><input id="projectPublished" type="checkbox" style="width:auto"> Publicar en el catálogo</label><button>Guardar proyecto</button><button type="button" class="secondary" id="resetProject">Nuevo / limpiar</button></form><div id="projectList"></div></section><section id="services" class="panel tab hide"><h2>Servicios</h2><form id="serviceForm"><input type="hidden" id="serviceId"><label>Nombre<input id="serviceTitle" required></label><label>Categoría<input id="serviceCategory" value="Construcción"></label><label>Descripción<textarea id="serviceDescription"></textarea></label><label>Orden<input id="serviceOrder" type="number" value="0"></label><label><input id="servicePublished" type="checkbox" style="width:auto"> Publicar</label><button>Guardar servicio</button><button type="button" class="secondary" id="resetService">Nuevo / limpiar</button></form><div id="serviceList"></div></section><section id="settings" class="panel tab hide"><h2>Contactos y redes</h2><form id="settingsForm"><label>WhatsApp (código de país + número, solo dígitos)<input id="whatsapp" value="50762626272" required></label><label>Correo<input id="contactEmail" type="email"></label><label>Instagram (URL completa)<input id="instagram" type="url"></label><label>Facebook (URL completa)<input id="facebook" type="url"></label><label>LinkedIn (URL completa)<input id="linkedin" type="url"></label><button>Guardar contactos</button></form></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><script src="acon-client.js"></script><script src="admin.js"></script></body></html>
